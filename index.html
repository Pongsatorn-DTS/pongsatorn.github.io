<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Pongsatorn Chomkeaw | Email Signature</title>

<meta
    name="description"
    content="Pongsatorn Chomkeaw — Business Consultant, Digital Transformation Solution at RICOH (THAILAND) LIMITED."
>

<style>

/* =========================================================
   EMAIL SIGNATURE
   Corporate / Executive Style
   ========================================================= */

body {
    margin: 0;
    padding: 0;
    background: #ffffff;
    font-family:
        Arial,
        Helvetica,
        sans-serif;
    color: #1f2937;
}


/* =========================================================
   MAIN CONTAINER
   ========================================================= */

.signature {
    width: 760px;
    max-width: 100%;
    border-collapse: collapse;
    background: #ffffff;
}


/* =========================================================
   PROFILE IMAGE
   ========================================================= */

.photo-cell {
    width: 190px;
    padding: 0 24px 0 0;
    vertical-align: middle;
}

.profile-wrapper {
    width: 180px;
    height: 180px;
}

.profile-photo {
    display: block;

    width: 180px;
    height: 180px;

    object-fit: cover;

    border-radius: 18px;

    border: 1px solid #d9dde3;
}


/* =========================================================
   CONTENT AREA
   ========================================================= */

.content {
    padding: 2px 0 2px 24px;

    border-left: 3px solid #1f4e79;

    vertical-align: middle;
}


/* =========================================================
   NAME
   ========================================================= */

.name {
    margin: 0;

    font-size: 25px;
    line-height: 30px;

    font-weight: 700;

    letter-spacing: -0.3px;

    color: #17365d;
}


/* =========================================================
   POSITION
   ========================================================= */

.position {
    margin-top: 5px;

    font-size: 14px;
    line-height: 20px;

    font-weight: 600;

    color: #1f4e79;
}


/* =========================================================
   COMPANY
   ========================================================= */

.company {
    margin-top: 2px;

    font-size: 12px;
    line-height: 18px;

    color: #6b7280;
}


/* =========================================================
   DIVIDER
   ========================================================= */

.divider {
    height: 1px;

    margin: 13px 0;

    background: #dfe5eb;
}


/* =========================================================
   CONTACT INFORMATION
   ========================================================= */

.contact {
    font-size: 12px;
    line-height: 19px;

    color: #374151;
}

.contact-row {
    padding: 1px 0;
}


/* =========================================================
   ICON
   ========================================================= */

.icon {
    display: inline-block;

    width: 24px;

    font-size: 11px;

    font-weight: 700;

    color: #1f4e79;
}


/* =========================================================
   LINKS
   ========================================================= */

.contact a {
    color: #374151;

    text-decoration: none;
}

.contact a:hover {
    color: #1f4e79;
}


/* =========================================================
   ADDRESS
   ========================================================= */

.address {
    color: #6b7280;
}


/* =========================================================
   SOCIAL / LINKEDIN
   ========================================================= */

.social {
    margin-top: 11px;
}

.social a {
    display: inline-block;

    padding: 6px 12px;

    border-radius: 5px;

    background: #1f4e79;

    color: #ffffff !important;

    font-size: 11px;

    line-height: 14px;

    font-weight: 600;

    text-decoration: none;
}

.social a:hover {
    background: #17365d;
}


/* =========================================================
   COMPANY TAG
   ========================================================= */

.company-tag {
    display: inline-block;

    margin-top: 10px;

    padding: 4px 8px;

    border: 1px solid #d9e1ea;

    border-radius: 4px;

    font-size: 9px;

    line-height: 11px;

    font-weight: 700;

    letter-spacing: .4px;

    color: #1f4e79;

    background: #f7f9fb;
}

</style>
</head>


<body>

<table
    class="signature"
    cellpadding="0"
    cellspacing="0"
    border="0"
    role="presentation"
>

<tr>


<!-- =====================================================
     LARGE PROFILE IMAGE
     ===================================================== -->

<td class="photo-cell">

    <div class="profile-wrapper">

        <img
            src="profile.jpg"
            width="180"
            height="180"
            alt="Pongsatorn Chomkeaw"
            class="profile-photo"
        >

    </div>

</td>


<!-- =====================================================
     PERSONAL INFORMATION
     ===================================================== -->

<td class="content">


    <!-- NAME -->

    <div class="name">
        Pongsatorn Chomkeaw
    </div>


    <!-- POSITION -->

    <div class="position">
        Business Consultant
    </div>


    <!-- DEPARTMENT / SPECIALIZATION -->

    <div class="company">
        Digital Transformation Solution
        <br>

        RICOH (THAILAND) LIMITED
    </div>


    <!-- DIVIDER -->

    <div class="divider"></div>


    <!-- =================================================
         CONTACT DETAILS
         ================================================= -->

    <div class="contact">


        <!-- MOBILE -->

        <div class="contact-row">

            <span class="icon">
                TEL
            </span>

            <a href="tel:+66XXXXXXXXX">
                +66 XX XXX XXXX
            </a>

        </div>


        <!-- OFFICE -->

        <div class="contact-row">

            <span class="icon">
                OFF
            </span>

            <a href="tel:+662XXXXXXX">
                +66 2 XXX XXXX
            </a>

        </div>


        <!-- EMAIL -->

        <div class="contact-row">

            <span class="icon">
                MAIL
            </span>

            <a href="mailto:your.email@ricoh.co.th">
                your.email@ricoh.co.th
            </a>

        </div>


        <!-- WEBSITE -->

        <div class="contact-row">

            <span class="icon">
                WEB
            </span>

            <a
                href="https://www.ricoh.co.th"
                target="_blank"
            >
                www.ricoh.co.th
            </a>

        </div>


        <!-- OFFICE ADDRESS -->

        <div class="contact-row address">

            <span class="icon">
                LOC
            </span>

            8th Floor, RICOH Building,
            Bangkok, Thailand

        </div>


    </div>


    <!-- =================================================
         LINKEDIN
         ================================================= -->

    <div class="social">

        <a
            href="https://www.linkedin.com/"
            target="_blank"
        >
            LinkedIn Profile
        </a>

    </div>


    <!-- =================================================
         COMPANY / BUSINESS TAG
         ================================================= -->

    <div class="company-tag">

        RICOH · DIGITAL TRANSFORMATION

    </div>


</td>

</tr>

</table>

</body>
</html>
