<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pongsatorn Chomkeaw | Email Signature</title>

<style>
    body {
        margin: 0;
        padding: 0;
        background: #ffffff;
        font-family: Arial, Helvetica, sans-serif;
        color: #1f2937;
    }

    .signature {
        width: 700px;
        max-width: 100%;
        border-collapse: collapse;
        background: #ffffff;
    }

    .photo-cell {
        width: 180px;
        padding: 0 22px 0 0;
        vertical-align: middle;
    }

    .profile-photo {
        width: 170px;
        height: 170px;
        display: block;
        object-fit: cover;
        border-radius: 18px;
        border: 1px solid #e5e7eb;
    }

    .content {
        padding-left: 22px;
        border-left: 3px solid #111827;
        vertical-align: middle;
    }

    .name {
        margin: 0;
        font-size: 24px;
        line-height: 30px;
        font-weight: 700;
        color: #111827;
        letter-spacing: -0.3px;
    }

    .position {
        margin: 4px 0 0 0;
        font-size: 14px;
        line-height: 20px;
        color: #4b5563;
        font-weight: 600;
    }

    .company {
        margin: 2px 0 0 0;
        font-size: 13px;
        line-height: 19px;
        color: #6b7280;
    }

    .divider {
        height: 1px;
        background: #e5e7eb;
        margin: 13px 0;
    }

    .contact {
        font-size: 12px;
        line-height: 20px;
        color: #374151;
    }

    .contact-row {
        padding: 2px 0;
    }

    .icon {
        display: inline-block;
        width: 22px;
        color: #111827;
        font-weight: bold;
    }

    .contact a {
        color: #374151;
        text-decoration: none;
    }

    .contact a:hover {
        color: #111827;
    }

    .linkedin {
        margin-top: 10px;
    }

    .linkedin a {
        display: inline-block;
        padding: 6px 11px;
        background: #111827;
        color: #ffffff !important;
        text-decoration: none;
        font-size: 11px;
        font-weight: 600;
        border-radius: 5px;
    }

    .linkedin a:hover {
        background: #374151;
    }

    .location {
        color: #6b7280;
    }
</style>
</head>

<body>

<table
    class="signature"
    cellpadding="0"
    cellspacing="0"
    border="0"
    role="presentation"
>
    <tr>

        <!-- LARGE PROFILE IMAGE -->
        <td class="photo-cell">
            <img
                src="profile.jpg"
                width="170"
                height="170"
                alt="Pongsatorn Chomkeaw"
                class="profile-photo"
            >
        </td>

        <!-- INFORMATION -->
        <td class="content">

            <div class="name">
                Pongsatorn Chomkeaw
            </div>

            <div class="position">
                Business Consultant
            </div>

            <div class="company">
                Digital Transformation Solution
                <br>
                RICOH (THAILAND) LIMITED
            </div>

            <div class="divider"></div>

            <!-- CONTACT INFORMATION -->
            <div class="contact">

                <div class="contact-row">
                    <span class="icon">M</span>
                    <a href="tel:+66XXXXXXXXX">
                        +66 XX XXX XXXX
                    </a>
                </div>

                <div class="contact-row">
                    <span class="icon">@</span>
                    <a href="mailto:your.email@ricoh.co.th">
                        your.email@ricoh.co.th
                    </a>
                </div>

                <div class="contact-row">
                    <span class="icon">W</span>
                    <a href="https://www.ricoh.co.th">
                        www.ricoh.co.th
                    </a>
                </div>

                <div class="contact-row location">
                    <span class="icon">⌖</span>
                    Bangkok, Thailand
                </div>

            </div>

            <!-- LINKEDIN -->
            <div class="linkedin">
                <a
                    href="https://www.linkedin.com/"
                    target="_blank"
                >
                    LinkedIn Profile
                </a>
            </div>

        </td>

    </tr>
</table>

</body>
</html>
